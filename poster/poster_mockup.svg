<text x="568.3333333333334" y="163" font-family="IPAGothic, sans-serif" font-size="10.5" fill="#ffffff" font-weight="bold" text-anchor="start">目的・戦略</text>
<text x="568.3333333333334" y="182" font-family="IPAGothic, sans-serif" font-size="9.2" fill="#222" font-weight="normal" text-anchor="start">目的: ハイドロトロープ機能と自己修復性を</text>
<text x="568.3333333333334" y="194.5" font-family="IPAGothic, sans-serif" font-size="9.2" fill="#222" font-weight="normal" text-anchor="start">両立した注入ゲルの開発</text>
<text x="568.3333333333334" y="207.0" font-family="IPAGothic, sans-serif" font-size="9.2" fill="#222" font-weight="normal" text-anchor="start">戦略: PGD+GCの水素結合(物理架橋)で</text>
<text x="568.3333333333334" y="219.5" font-family="IPAGothic, sans-serif" font-size="9.2" fill="#222" font-weight="normal" text-anchor="start">自発形成する超分子ハイドロゲルを利用</text>
<text x="568.3333333333334" y="232.0" font-family="IPAGothic, sans-serif" font-size="9.2" fill="#222" font-weight="normal" text-anchor="start">→ PGDがPTXを高濃度保持し局所徐放</text>
<rect x="568.3333333333334" y="263" width="247.66666666666669" height="66" rx="3" fill="#ffffff" stroke="#b0bcc7" stroke-width="1"/>
