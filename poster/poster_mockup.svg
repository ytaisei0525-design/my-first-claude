<text x="568.3333333333334" y="412" font-family="IPAGothic, sans-serif" font-size="9.2" fill="#222" font-weight="normal" text-anchor="start">・in vitro: 赤色化ゲルをシリンジ吐出→即ゲル化</text>
<text x="568.3333333333334" y="424.5" font-family="IPAGothic, sans-serif" font-size="9.2" fill="#222" font-weight="normal" text-anchor="start">・in vivo: マウス背部皮下へ注入(0.25 mL)</text>
