<text x="25" y="692.5" font-family="IPAGothic, sans-serif" font-size="10.5" fill="#ffffff" font-weight="bold" text-anchor="start">レオロジー｜自己修復性 (In vitro・目玉)</text>
<text x="25" y="711.5" font-family="IPAGothic, sans-serif" font-size="9.2" fill="#222" font-weight="normal" text-anchor="start">・G'&gt;G'' 安定なゲルネットワーク</text>
<text x="25" y="724.0" font-family="IPAGothic, sans-serif" font-size="9.2" fill="#222" font-weight="normal" text-anchor="start">・大歪500%でゾル化→低歪で即G'回復</text>
<text x="25" y="736.5" font-family="IPAGothic, sans-serif" font-size="9.2" fill="#222" font-weight="normal" text-anchor="start">・複数サイクルで再現 → 自己修復を実証</text>
