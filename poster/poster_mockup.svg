<text x="296.6666666666667" y="711.5" font-family="IPAGothic, sans-serif" font-size="9.2" fill="#222" font-weight="normal" text-anchor="start">・37℃ PBS中で分解、滞留期間を制御</text>
<text x="296.6666666666667" y="724.0" font-family="IPAGothic, sans-serif" font-size="9.2" fill="#222" font-weight="normal" text-anchor="start">・PG3-1:3日 / PG4-025:25日</text>
<text x="296.6666666666667" y="736.5" font-family="IPAGothic, sans-serif" font-size="9.2" fill="#222" font-weight="normal" text-anchor="start">・→ 数日〜数週間で任意に制御</text>
