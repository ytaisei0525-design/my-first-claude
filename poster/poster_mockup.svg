<svg xmlns="http://www.w3.org/2000/svg" width="841" height="1189" viewBox="0 0 841 1189">
<rect width="841" height="1189" fill="#f4f6f8"/>
<rect x="18" y="18" width="805" height="88" rx="8" fill="#0d3b66" stroke="#0d3b66" stroke-width="1"/>
<text x="420.5" y="46" font-family="IPAGothic, sans-serif" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="middle">ポリグリセロールデンドリマーとグリコールキトサンの水素結合による</text>
<text x="420.5" y="68" font-family="IPAGothic, sans-serif" font-size="17" fill="#ffffff" font-weight="bold" text-anchor="middle">注入可能・自己修復型 超分子ハイドロゲルの創製</text>
<text x="420.5" y="88" font-family="IPAGothic, sans-serif" font-size="10.5" fill="#cfe0f0" font-weight="normal" text-anchor="middle">〇山道 大誠¹  Cho Iksung²³  田中 賢²³ （九州大学 工学部／工学府／先導物質化学研究所）</text>
<rect x="18" y="116" width="805" height="26" rx="5" fill="#0d3b66"/>
<text x="30" y="134" font-family="IPAGothic, sans-serif" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="start">Introduction ｜ 背景・着眼点・目的</text>
<rect x="18" y="148" width="261.6666666666667" height="218" rx="6" fill="#e8eef5" stroke="#90a4b5" stroke-width="1.2"/>
<rect x="18" y="148" width="261.6666666666667" height="20" rx="6" fill="#4a6178"/>
<rect x="18" y="158" width="261.6666666666667" height="10" fill="#4a6178"/>
<text x="25" y="163" font-family="IPAGothic, sans-serif" font-size="10.5" fill="#ffffff" font-weight="bold" text-anchor="start">化学療法の課題</text>
<text x="25" y="182" font-family="IPAGothic, sans-serif" font-size="9.2" fill="#222" font-weight="normal" text-anchor="start">・全身投与は腫瘍到達率 中央値0.7%</text>
<text x="25" y="194.5" font-family="IPAGothic, sans-serif" font-size="9.2" fill="#222" font-weight="normal" text-anchor="start">・骨髄抑制・脱毛など重篤な副作用</text>
<text x="25" y="207.0" font-family="IPAGothic, sans-serif" font-size="9.2" fill="#222" font-weight="normal" text-anchor="start">・PTXは水溶解度&lt;0.5µg/mL</text>
<text x="25" y="219.5" font-family="IPAGothic, sans-serif" font-size="9.2" fill="#222" font-weight="normal" text-anchor="start">・可溶化剤Cremophor ELが重篤毒性</text>
<text x="25" y="232.0" font-family="IPAGothic, sans-serif" font-size="9.2" fill="#222" font-weight="normal" text-anchor="start">→ 無毒可溶化+局所投与のDDSが必要</text>
<rect x="25" y="279" width="247.66666666666669" height="80" rx="3" fill="#ffffff" stroke="#b0bcc7" stroke-width="1"/>
<line x1="25" y1="279" x2="272.6666666666667" y2="359" stroke="#b0bcc7" stroke-width="0.8"/>
<line x1="25" y1="359" x2="272.6666666666667" y2="279" stroke="#b0bcc7" stroke-width="0.8"/>
<text x="148.83333333333334" y="323.0" font-family="IPAGothic, sans-serif" font-size="8.6" fill="#6b7884" font-weight="normal" text-anchor="middle">図: PTX/CrEL構造・0.7%模式図</text>
<rect x="289.6666666666667" y="148" width="261.6666666666667" height="218" rx="6" fill="#e8eef5" stroke="#90a4b5" stroke-width="1.2"/>
<rect x="289.6666666666667" y="148" width="261.6666666666667" height="20" rx="6" fill="#4a6178"/>
<rect x="289.6666666666667" y="158" width="261.6666666666667" height="10" fill="#4a6178"/>
<text x="296.6666666666667" y="163" font-family="IPAGothic, sans-serif" font-size="10.5" fill="#ffffff" font-weight="bold" text-anchor="start">着眼点: 2機能を1材料で</text>
<text x="296.6666666666667" y="182" font-family="IPAGothic, sans-serif" font-size="9.2" fill="#222" font-weight="normal" text-anchor="start">・PGD: 単分散・中間水・生体適合性</text>
<text x="296.6666666666667" y="194.5" font-family="IPAGothic, sans-serif" font-size="9.2" fill="#222" font-weight="normal" text-anchor="start">・単分子ハイドロトロープ機能</text>
<text x="296.6666666666667" y="207.0" font-family="IPAGothic, sans-serif" font-size="9.2" fill="#222" font-weight="normal" text-anchor="start">  → PTXを高可溶化(PEG400の約10倍)</text>
<text x="296.6666666666667" y="219.5" font-family="IPAGothic, sans-serif" font-size="9.2" fill="#222" font-weight="normal" text-anchor="start">・shear-thinning型: 注入後に自己修復</text>
<text x="296.6666666666667" y="232.0" font-family="IPAGothic, sans-serif" font-size="9.2" fill="#222" font-weight="normal" text-anchor="start">  → 液だれせず患部に留まる</text>
<rect x="296.6666666666667" y="279" width="247.66666666666669" height="80" rx="3" fill="#ffffff" stroke="#b0bcc7" stroke-width="1"/>
<line x1="296.6666666666667" y1="279" x2="544.3333333333334" y2="359" stroke="#b0bcc7" stroke-width="0.8"/>
<line x1="296.6666666666667" y1="359" x2="544.3333333333334" y2="279" stroke="#b0bcc7" stroke-width="0.8"/>
<text x="420.5" y="323.0" font-family="IPAGothic, sans-serif" font-size="8.6" fill="#6b7884" font-weight="normal" text-anchor="middle">図: PGD構造 / 溶解度 / shear機構</text>
<rect x="561.3333333333334" y="148" width="261.6666666666667" height="218" rx="6" fill="#e8eef5" stroke="#90a4b5" stroke-width="1.2"/>
<rect x="561.3333333333334" y="148" width="261.6666666666667" height="20" rx="6" fill="#4a6178"/>
<rect x="561.3333333333334" y="158" width="261.6666666666667" height="10" fill="#4a6178"/>
<text x="568.3333333333334" y="163" font-family="IPAGothic, sans-serif" font-size="10.5" fill="#ffffff" font-weight="bold" text-anchor="start">目的・戦略</text>
<text x="568.3333333333334" y="182" font-family="IPAGothic, sans-serif" font-size="9.2" fill="#222" font-weight="normal" text-anchor="start">目的: ハイドロトロープ機能と自己修復性を</text>
<text x="568.3333333333334" y="194.5" font-family="IPAGothic, sans-serif" font-size="9.2" fill="#222" font-weight="normal" text-anchor="start">両立した注入ゲルの開発</text>
<text x="568.3333333333334" y="207.0" font-family="IPAGothic, sans-serif" font-size="9.2" fill="#222" font-weight="normal" text-anchor="start">戦略: PGD+GCの水素結合(物理架橋)で</text>
<text x="568.3333333333334" y="219.5" font-family="IPAGothic, sans-serif" font-size="9.2" fill="#222" font-weight="normal" text-anchor="start">自発形成する超分子ハイドロゲルを利用</text>
<text x="568.3333333333334" y="232.0" font-family="IPAGothic, sans-serif" font-size="9.2" fill="#222" font-weight="normal" text-anchor="start">→ PGDがPTXを高濃度保持し局所徐放</text>
<rect x="568.3333333333334" y="279" width="247.66666666666669" height="80" rx="3" fill="#ffffff" stroke="#b0bcc7" stroke-width="1"/>
<line x1="568.3333333333334" y1="279" x2="816.0" y2="359" stroke="#b0bcc7" stroke-width="0.8"/>
<line x1="568.3333333333334" y1="359" x2="816.0" y2="279" stroke="#b0bcc7" stroke-width="0.8"/>
<text x="692.1666666666667" y="323.0" font-family="IPAGothic, sans-serif" font-size="8.6" fill="#6b7884" font-weight="normal" text-anchor="middle">図: PGD+GC 超分子ゲル形成(中心図)</text>
<rect x="18" y="376" width="805" height="26" rx="5" fill="#33506b"/>
<text x="30" y="394" font-family="IPAGothic, sans-serif" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="start">Results &amp; Discussion ｜ データ（左→右で研究の流れ）</text>
<rect x="18" y="408" width="261.6666666666667" height="529" rx="6" fill="#fdf0d5" stroke="#90a4b5" stroke-width="1.2"/>
<rect x="18" y="408" width="261.6666666666667" height="20" rx="6" fill="#c9962a"/>
<rect x="18" y="418" width="261.6666666666667" height="10" fill="#c9962a"/>
<text x="25" y="423" font-family="IPAGothic, sans-serif" font-size="10.5" fill="#ffffff" font-weight="bold" text-anchor="start">① 合成｜PGD G4 の精密合成〔新〕</text>
<text x="25" y="442" font-family="IPAGothic, sans-serif" font-size="9.2" fill="#222" font-weight="normal" text-anchor="start">・Divergent法(全8段階)で単分散PGD G4を合成</text>
<text x="25" y="454.5" font-family="IPAGothic, sans-serif" font-size="9.2" fill="#222" font-weight="normal" text-anchor="start">・撹拌強化+反応時間2倍で高世代を最適化</text>
<text x="25" y="467.0" font-family="IPAGothic, sans-serif" font-size="9.2" fill="#222" font-weight="normal" text-anchor="start">・G3.5→G4 収率90%, 13.0 g を取得</text>
<text x="25" y="479.5" font-family="IPAGothic, sans-serif" font-size="9.2" fill="#222" font-weight="normal" text-anchor="start">・MALDI単一ピーク [M+Na]+=3488</text>
<text x="25" y="492.0" font-family="IPAGothic, sans-serif" font-size="9.2" fill="#222" font-weight="normal" text-anchor="start">  → 単分散の高品質体を確認</text>
<rect x="25" y="517" width="247.66666666666669" height="413" rx="3" fill="#ffffff" stroke="#b0bcc7" stroke-width="1"/>
<line x1="25" y1="517" x2="272.6666666666667" y2="930" stroke="#b0bcc7" stroke-width="0.8"/>
<line x1="25" y1="930" x2="272.6666666666667" y2="517" stroke="#b0bcc7" stroke-width="0.8"/>
<text x="148.83333333333334" y="727.5" font-family="IPAGothic, sans-serif" font-size="8.6" fill="#6b7884" font-weight="normal" text-anchor="middle">図: MALDI(最適化前後) / 収率表・NMR</text>
<rect x="289.6666666666667" y="408" width="261.6666666666667" height="529" rx="6" fill="#dbeafe" stroke="#90a4b5" stroke-width="1.2"/>
<rect x="289.6666666666667" y="408" width="261.6666666666667" height="20" rx="6" fill="#2563eb"/>
<rect x="289.6666666666667" y="418" width="261.6666666666667" height="10" fill="#2563eb"/>
<text x="296.6666666666667" y="423" font-family="IPAGothic, sans-serif" font-size="10.5" fill="#ffffff" font-weight="bold" text-anchor="start">② ゲル化・架橋・力学｜ゲル化と自己修復性〔新〕</text>
<text x="296.6666666666667" y="442" font-family="IPAGothic, sans-serif" font-size="9.2" fill="#222" font-weight="normal" text-anchor="start">・世代↑・PGD比↑でゲル化時間を短縮</text>
<text x="296.6666666666667" y="454.5" font-family="IPAGothic, sans-serif" font-size="9.2" fill="#222" font-weight="normal" text-anchor="start">  (PG4-025: 2分 / PG3-1: 67分)</text>
<text x="296.6666666666667" y="467.0" font-family="IPAGothic, sans-serif" font-size="9.2" fill="#222" font-weight="normal" text-anchor="start">・GCアセチル化: DA↑でゲル化遅延</text>
<text x="296.6666666666667" y="479.5" font-family="IPAGothic, sans-serif" font-size="9.2" fill="#222" font-weight="normal" text-anchor="start">  (16.7%:1.5h→90%:80h) →アミノ基が主架橋点</text>
<text x="296.6666666666667" y="492.0" font-family="IPAGothic, sans-serif" font-size="9.2" fill="#222" font-weight="normal" text-anchor="start">・レオロジー: 大歪500%でゾル化→低歪で即回復</text>
<text x="296.6666666666667" y="504.5" font-family="IPAGothic, sans-serif" font-size="9.2" fill="#222" font-weight="normal" text-anchor="start">  → シアシニング &amp; 自己修復を実証</text>
<rect x="296.6666666666667" y="517" width="247.66666666666669" height="413" rx="3" fill="#ffffff" stroke="#b0bcc7" stroke-width="1"/>
<line x1="296.6666666666667" y1="517" x2="544.3333333333334" y2="930" stroke="#b0bcc7" stroke-width="0.8"/>
<line x1="296.6666666666667" y1="930" x2="544.3333333333334" y2="517" stroke="#b0bcc7" stroke-width="0.8"/>
<text x="420.5" y="727.5" font-family="IPAGothic, sans-serif" font-size="8.6" fill="#6b7884" font-weight="normal" text-anchor="middle">図: ゲル化時間 / DA vs ゲル化 / レオロジー</text>
<rect x="561.3333333333334" y="408" width="261.6666666666667" height="529" rx="6" fill="#dbeafe" stroke="#90a4b5" stroke-width="1.2"/>
<rect x="561.3333333333334" y="408" width="261.6666666666667" height="20" rx="6" fill="#2563eb"/>
<rect x="561.3333333333334" y="418" width="261.6666666666667" height="10" fill="#2563eb"/>
<text x="568.3333333333334" y="423" font-family="IPAGothic, sans-serif" font-size="10.5" fill="#ffffff" font-weight="bold" text-anchor="start">③ 生体適合性｜分解性と細胞適合性 (In vitro)〔新〕</text>
<text x="568.3333333333334" y="442" font-family="IPAGothic, sans-serif" font-size="9.2" fill="#222" font-weight="normal" text-anchor="start">・37℃ PBS中で分解、滞留期間を制御</text>
<text x="568.3333333333334" y="454.5" font-family="IPAGothic, sans-serif" font-size="9.2" fill="#222" font-weight="normal" text-anchor="start">  (PG3-1:3日 / PG4-025:25日)</text>
<text x="568.3333333333334" y="467.0" font-family="IPAGothic, sans-serif" font-size="9.2" fill="#222" font-weight="normal" text-anchor="start">・D1細胞包埋 Live/Dead: 1/5/9日とも</text>
<text x="568.3333333333334" y="479.5" font-family="IPAGothic, sans-serif" font-size="9.2" fill="#222" font-weight="normal" text-anchor="start">  死細胞ほぼ無し(溶解後も毒性なし)</text>
<text x="568.3333333333334" y="492.0" font-family="IPAGothic, sans-serif" font-size="9.2" fill="#222" font-weight="normal" text-anchor="start">→ 化学架橋剤なしで高生体適合性</text>
<rect x="568.3333333333334" y="517" width="247.66666666666669" height="413" rx="3" fill="#ffffff" stroke="#b0bcc7" stroke-width="1"/>
<line x1="568.3333333333334" y1="517" x2="816.0" y2="930" stroke="#b0bcc7" stroke-width="0.8"/>
<line x1="568.3333333333334" y1="930" x2="816.0" y2="517" stroke="#b0bcc7" stroke-width="0.8"/>
<text x="692.1666666666667" y="727.5" font-family="IPAGothic, sans-serif" font-size="8.6" fill="#6b7884" font-weight="normal" text-anchor="middle">図: 分解曲線 / Live-Dead 蛍光像</text>
<rect x="18" y="947" width="805" height="158" rx="8" fill="#fbf3ee" stroke="#ea580c" stroke-width="2"/>
<rect x="18" y="947" width="805" height="22" rx="8" fill="#33506b"/>
<rect x="18" y="959" width="805" height="10" fill="#33506b"/>
<text x="30" y="963" font-family="IPAGothic, sans-serif" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="start">C. 実用性評価 ｜ 注入試験（In vitro → In vivo）〔新データ・目玉〕</text>
<rect x="26" y="975" width="388.5" height="122" rx="6" fill="#dbeafe" stroke="#90a4b5" stroke-width="1.2"/>
<rect x="26" y="975" width="388.5" height="20" rx="6" fill="#2563eb"/>
<rect x="26" y="985" width="388.5" height="10" fill="#2563eb"/>
<text x="33" y="990" font-family="IPAGothic, sans-serif" font-size="10.5" fill="#ffffff" font-weight="bold" text-anchor="start">C-1. in vitro 注入試験</text>
<text x="33" y="1009" font-family="IPAGothic, sans-serif" font-size="9.2" fill="#222" font-weight="normal" text-anchor="start">・赤色化PG4-0125をシリンジから吐出</text>
<text x="33" y="1021.5" font-family="IPAGothic, sans-serif" font-size="9.2" fill="#222" font-weight="normal" text-anchor="start">・針内で高せん断→ゾル化(シアシニング)</text>
<text x="33" y="1034.0" font-family="IPAGothic, sans-serif" font-size="9.2" fill="#222" font-weight="normal" text-anchor="start">・吐出直後に即ゲル化、液だれせず形状保持</text>
<text x="33" y="1046.5" font-family="IPAGothic, sans-serif" font-size="9.2" fill="#222" font-weight="normal" text-anchor="start">→ レオロジーの挙動を実機操作で可視化</text>
<rect x="33" y="1046" width="374.5" height="44" rx="3" fill="#ffffff" stroke="#b0bcc7" stroke-width="1"/>
<line x1="33" y1="1046" x2="407.5" y2="1090" stroke="#b0bcc7" stroke-width="0.8"/>
<line x1="33" y1="1090" x2="407.5" y2="1046" stroke="#b0bcc7" stroke-width="0.8"/>
<text x="220.25" y="1072.0" font-family="IPAGothic, sans-serif" font-size="8.6" fill="#6b7884" font-weight="normal" text-anchor="middle">図: in vitro 注入の連続写真</text>
<rect x="426.5" y="975" width="388.5" height="122" rx="6" fill="#ffe3d3" stroke="#90a4b5" stroke-width="1.2"/>
<rect x="426.5" y="975" width="388.5" height="20" rx="6" fill="#ea580c"/>
<rect x="426.5" y="985" width="388.5" height="10" fill="#ea580c"/>
<text x="433.5" y="990" font-family="IPAGothic, sans-serif" font-size="10.5" fill="#ffffff" font-weight="bold" text-anchor="start">C-2. in vivo マウス皮下注入試験（最重要）</text>
<text x="433.5" y="1009" font-family="IPAGothic, sans-serif" font-size="9.2" fill="#222" font-weight="normal" text-anchor="start">・香港大 Sang-Jin Lee先生との共同研究</text>
<text x="433.5" y="1021.5" font-family="IPAGothic, sans-serif" font-size="9.2" fill="#222" font-weight="normal" text-anchor="start">・PG4-0125(0.25mL)をマウス背部皮下へ注入</text>
<text x="433.5" y="1034.0" font-family="IPAGothic, sans-serif" font-size="9.2" fill="#222" font-weight="normal" text-anchor="start">・抵抗なく注入→生体内で即座に自己修復</text>
<text x="433.5" y="1046.5" font-family="IPAGothic, sans-serif" font-size="9.2" fill="#222" font-weight="normal" text-anchor="start">→ 局所に明瞭なドーム状デポを形成し実用性実証</text>
<rect x="433.5" y="1046" width="374.5" height="44" rx="3" fill="#ffffff" stroke="#b0bcc7" stroke-width="1"/>
<line x1="433.5" y1="1046" x2="808.0" y2="1090" stroke="#b0bcc7" stroke-width="0.8"/>
<line x1="433.5" y1="1090" x2="808.0" y2="1046" stroke="#b0bcc7" stroke-width="0.8"/>
<text x="620.75" y="1072.0" font-family="IPAGothic, sans-serif" font-size="8.6" fill="#6b7884" font-weight="normal" text-anchor="middle">図: in vivo マウス皮下デポ写真(大きく)</text>
<rect x="18" y="1115" width="805" height="56" rx="6" fill="#d8f3dc" stroke="#2d6a4f" stroke-width="1.2"/>
<text x="28" y="1133" font-family="IPAGothic, sans-serif" font-size="11" fill="#1d3a2a" font-weight="bold" text-anchor="start">Conclusion:</text>
<text x="113" y="1133" font-family="IPAGothic, sans-serif" font-size="9.3" fill="#1d3a2a" font-weight="normal" text-anchor="start">単分散PGD G4を確立 → 水素結合で超分子ゲル形成（自己修復・分解性を制御, 高生体適合性） → in vivoで局所デポを形成し実用性を実証</text>
<text x="28" y="1153" font-family="IPAGothic, sans-serif" font-size="10" fill="#33506b" font-weight="bold" text-anchor="start">Future:</text>
<text x="80" y="1153" font-family="IPAGothic, sans-serif" font-size="8.5" fill="#3a4a55" font-weight="normal" text-anchor="start">PTX徐放定量(HPLC) / 担がんマウスで抗腫瘍効果 / PGD G5合成 / DSCで中間水評価　　Ref: Ooya Gels 2022 ; Cho&amp;Ooya 2018 ; Yamazaki Langmuir 2021 ほか</text>
</svg>