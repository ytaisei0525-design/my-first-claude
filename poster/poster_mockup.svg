<text x="296.6666666666667" y="783.5" font-family="IPAGothic, sans-serif" font-size="9.2" fill="#222" font-weight="normal" text-anchor="start">・37℃ PBS中の重量変化で分解を評価</text>
<text x="296.6666666666667" y="796.0" font-family="IPAGothic, sans-serif" font-size="9.2" fill="#222" font-weight="normal" text-anchor="start">・PG3-1:3日 / PG4-0125:4日 / PG4-025:25日</text>
<text x="296.6666666666667" y="808.5" font-family="IPAGothic, sans-serif" font-size="9.2" fill="#222" font-weight="normal" text-anchor="start">・世代・混合比で滞留期間を制御</text>
<text x="296.6666666666667" y="821.0" font-family="IPAGothic, sans-serif" font-size="9.2" fill="#222" font-weight="normal" text-anchor="start">・→ 数日〜数週間で任意に制御可能</text>
