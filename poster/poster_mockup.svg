<text x="25" y="659.6666666666666" font-family="IPAGothic, sans-serif" font-size="9.2" fill="#222" font-weight="normal" text-anchor="start">・せん断除去で G' が即座に回復</text>
<text x="25" y="672.1666666666666" font-family="IPAGothic, sans-serif" font-size="9.2" fill="#222" font-weight="normal" text-anchor="start">・元の強固なゲル構造へ再構築</text>
<text x="25" y="684.6666666666666" font-family="IPAGothic, sans-serif" font-size="9.2" fill="#222" font-weight="normal" text-anchor="start">・複数サイクルで再現性よく回復</text>
