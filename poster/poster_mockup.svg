<text x="371.34" y="1009" font-family="IPAGothic, sans-serif" font-size="9.2" fill="#222" font-weight="normal" text-anchor="start">・香港大 Sang-Jin Lee先生との共同研究</text>
<text x="371.34" y="1021.5" font-family="IPAGothic, sans-serif" font-size="9.2" fill="#222" font-weight="normal" text-anchor="start">・PG4-0125(0.25mL)をマウス背部皮下へ注入</text>
<text x="371.34" y="1034.0" font-family="IPAGothic, sans-serif" font-size="9.2" fill="#222" font-weight="normal" text-anchor="start">・抵抗なく注入→生体内で即座に自己修復</text>
<text x="371.34" y="1046.5" font-family="IPAGothic, sans-serif" font-size="9.2" fill="#222" font-weight="normal" text-anchor="start">→ 局所に明瞭なドーム状デポを形成し実用性実証</text>
