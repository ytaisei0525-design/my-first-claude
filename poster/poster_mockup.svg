<text x="296.6666666666667" y="163" font-family="IPAGothic, sans-serif" font-size="10.5" fill="#ffffff" font-weight="bold" text-anchor="start">着眼点: 2機能を1材料で</text>
<text x="296.6666666666667" y="182" font-family="IPAGothic, sans-serif" font-size="9.2" fill="#222" font-weight="normal" text-anchor="start">・PGD: 単分散・中間水・生体適合性</text>
<text x="296.6666666666667" y="194.5" font-family="IPAGothic, sans-serif" font-size="9.2" fill="#222" font-weight="normal" text-anchor="start">・単分子ハイドロトロープ機能</text>
<text x="296.6666666666667" y="207.0" font-family="IPAGothic, sans-serif" font-size="9.2" fill="#222" font-weight="normal" text-anchor="start">  → PTXを高可溶化(PEG400の約10倍)</text>
<text x="296.6666666666667" y="219.5" font-family="IPAGothic, sans-serif" font-size="9.2" fill="#222" font-weight="normal" text-anchor="start">・shear-thinning型: 注入後に自己修復</text>
<text x="296.6666666666667" y="232.0" font-family="IPAGothic, sans-serif" font-size="9.2" fill="#222" font-weight="normal" text-anchor="start">  → 液だれせず患部に留まる</text>
