<text x="568.3333333333334" y="423" font-family="IPAGothic, sans-serif" font-size="10.5" fill="#ffffff" font-weight="bold" text-anchor="start">④ 生体適合性｜Live/Dead〔新〕</text>
<text x="568.3333333333334" y="442" font-family="IPAGothic, sans-serif" font-size="9.2" fill="#222" font-weight="normal" text-anchor="start">・D1細胞を3次元ゲル内に包埋し培養</text>
<text x="568.3333333333334" y="454.5" font-family="IPAGothic, sans-serif" font-size="9.2" fill="#222" font-weight="normal" text-anchor="start">・1/5/9日とも死細胞はほぼ観察されず</text>
<text x="568.3333333333334" y="467.0" font-family="IPAGothic, sans-serif" font-size="9.2" fill="#222" font-weight="normal" text-anchor="start">・溶解後も毒性なし</text>
<text x="568.3333333333334" y="479.5" font-family="IPAGothic, sans-serif" font-size="9.2" fill="#222" font-weight="normal" text-anchor="start">・→ 化学架橋剤なしで高い細胞生存率</text>
