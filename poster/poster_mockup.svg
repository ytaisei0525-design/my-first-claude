<rect x="561.3333333333334" y="148" width="261.6666666666667" height="188" rx="6" fill="#e8eef5" stroke="#90a4b5" stroke-width="1.2"/>
<rect x="561.3333333333334" y="148" width="261.6666666666667" height="20" rx="6" fill="#4a6178"/>
