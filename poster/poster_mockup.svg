<text x="25" y="393" font-family="IPAGothic, sans-serif" font-size="10.5" fill="#ffffff" font-weight="bold" text-anchor="start">① PGD G4 の精密合成〔新〕</text>
<text x="25" y="412" font-family="IPAGothic, sans-serif" font-size="9.2" fill="#222" font-weight="normal" text-anchor="start">・Divergent法(全8段階)で単分散PGD G4を合成</text>
<text x="25" y="424.5" font-family="IPAGothic, sans-serif" font-size="9.2" fill="#222" font-weight="normal" text-anchor="start">・撹拌強化+反応時間2倍で高世代を最適化</text>
<text x="25" y="437.0" font-family="IPAGothic, sans-serif" font-size="9.2" fill="#222" font-weight="normal" text-anchor="start">・収率90%, MALDI単一ピーク[M+Na]+=3488</text>
