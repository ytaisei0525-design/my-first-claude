<text x="296.6666666666667" y="412" font-family="IPAGothic, sans-serif" font-size="9.2" fill="#222" font-weight="normal" text-anchor="start">・D1細胞を3次元ゲル内に包埋し培養</text>
<text x="296.6666666666667" y="424.5" font-family="IPAGothic, sans-serif" font-size="9.2" fill="#222" font-weight="normal" text-anchor="start">・1/5/9日とも死細胞はほぼ観察されず</text>
<text x="296.6666666666667" y="437.0" font-family="IPAGothic, sans-serif" font-size="9.2" fill="#222" font-weight="normal" text-anchor="start">・溶解後も毒性なし</text>
<text x="296.6666666666667" y="449.5" font-family="IPAGothic, sans-serif" font-size="9.2" fill="#222" font-weight="normal" text-anchor="start">・→ 化学架橋剤なしで高い細胞生存率</text>
