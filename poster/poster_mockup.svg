<text x="25" y="915.3333333333333" font-family="IPAGothic, sans-serif" font-size="9.2" fill="#222" font-weight="normal" text-anchor="start">・高せん断でゲルが流動化(ゾル化)</text>
<text x="25" y="927.8333333333333" font-family="IPAGothic, sans-serif" font-size="9.2" fill="#222" font-weight="normal" text-anchor="start">・粘度が急低下 → 注射針を通過可能</text>
